name: Rebuild site and book

on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'images/**'
      - 'library/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow (image validation and placeholders)
        run: pip install --quiet pillow

      - name: Decode images sent as text (.b64 -> image), with validation
        run: |
          shopt -s nullglob
          for f in images/*.b64; do
            out="${f%.b64}"
            echo "decoding $f -> $out"
            if base64 -d "$f" > /tmp/decoded 2>/dev/null && \
               python3 -c "from PIL import Image; im=Image.open('/tmp/decoded'); im.load()" 2>/dev/null; then
              mv /tmp/decoded "$out"
              rm "$f"
              echo "OK: $out"
            else
              rm -f "$f" /tmp/decoded
              echo "::warning::$f was not a valid image and was discarded; existing image (if any) kept"
            fi
          done

      - name: Generate placeholders for any missing or broken recipe images
        run: |
          python3 - <<'EOF'
          import pathlib, re, subprocess
          from PIL import Image
          for md in sorted(pathlib.Path('recipes').glob('*.md')):
              front = md.read_text(encoding='utf-8').split('---')[1]
              meta = {}
              for line in front.strip().splitlines():
                  k, _, v = line.partition(':')
                  meta[k.strip()] = v.strip()
              img = pathlib.Path(meta.get('image', ''))
              title = meta.get('title', md.stem)
              ok = False
              if img and img.exists():
                  try:
                      im = Image.open(img); im.load(); ok = True
                  except Exception:
                      pass
              if img and not ok:
                  print(f"generating placeholder for {title} -> {img}")
                  subprocess.run(['python3', 'scripts/make_placeholder.py', title, str(img)], check=True)
          EOF

      - name: Rebuild website
        run: python3 scripts/build_site.py

      - name: Rebuild printable book (docx)
        run: |
          npm install --no-audit --no-fund docx
          node scripts/build_book.js

      - name: Convert book to PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer
          soffice --headless --convert-to pdf book/Licina-Family-Recipe-Book.docx --outdir book

      - name: Commit rebuilt files
        run: |
          git config user.name "recipe-book-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A images index.html book
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Rebuild site and book [skip ci]"
            git push
          fi
