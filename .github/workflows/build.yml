name: Rebuild recipe book
on:
  push:
    branches: [main]
    paths:
      - 'recipes/**'
      - 'images-src/**'
      - 'library/**'
      - 'scripts/**'
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare images (decode uploads, generate placeholders)
        run: |
          pip install --quiet pillow
          python3 scripts/ci_prepare_images.py

      - name: Build website
        run: python3 scripts/build_site.py

      - name: Build printable book (docx)
        run: |
          npm install --no-audit --no-fund docx
          node scripts/build_book.js

      - name: Convert book to PDF
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libreoffice-writer
          soffice --headless --convert-to pdf --outdir book book/Licina-Family-Recipe-Book.docx

      - name: Commit rebuilt outputs
        run: |
          git config user.name "recipe-book-bot"
          git config user.email "actions@github.com"
          git add images index.html book
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Rebuild site & book [skip ci]"
          git push
